repos:
  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: python -m isort --profile black
        language: system
        types: [python]
      - id: black
        name: black
        entry: python -m black
        language: system
        types: [python]
      - id: flake8
        name: flake8
        entry: python -m flake8 --max-line-length=88 --extend-ignore=E203
        language: system
        types: [python]
